                  - generic [ref=e1736]:
                    - generic [ref=e1737]:
                      - paragraph [ref=e1738]: "JOB ID: 732605BR"
                      - paragraph [ref=e1739]: "Date posted: Jun. 17, 2026"
                      - paragraph [ref=e1740]: "Description:"
                      - paragraph [ref=e1741]: WHAT WE'RE DOING
                      - text: Come join the CommandIQ® (CIQ) team – a product line established in 2025 with sizable investment and support from RMS senior leadership. We are developing mission critical Battle Management and Command & Control capabilities for a complete Command and Control mission suite. Our solution provides the open architecture as well as mission apps that can be customized to each user’s needs. Customers can also easily integrate their favorite tools into a single CommandIQ® Common Operating Picture (COP) to meet their own, specialized mission requirements.
                      - text: Join us and become a part of the team that is actively designing and developing the initial baseline which has already generated significant customer interest both domestically and internationally!
                      - text: "Check out these links for more information about our exciting suite of products:"
                      - text: https://www.lockheedmartin.com/en-us/products/command-and-control.html
                      - text: https://www.youtube.com/watch?v=mYu06sRV398
                      - paragraph [ref=e1742]: THE WORK
                      - text: "CommandIQ® is seeking a software engineer to join one of our agile development teams. In this role, you will:"
                      - list [ref=e1743]:
                        - listitem [ref=e1744]: Decompose higher-level roadmap features into actionable work items
                        - listitem [ref=e1745]: Design, Implement, and integrate/test software features
                        - listitem [ref=e1746]: Perform peer reviews for fellow software engineers and debug issues as they arise
                        - listitem [ref=e1747]: Participate in technical discussions to define/solve overarching software architecture needs
                        - listitem [ref=e1748]: Collaborate with cross-functional peers to better understand project requirements and customer/stakeholder needs
                      - paragraph [ref=e1749]: WHO WE ARE
                      - text: CommandIQ® is a geographically dispersed project team that executes in an agile – scrum setting. The team readily adapts to changing priorities as new information is discovered and project milestones shift to meet the various stakeholder needs. It has the opportunity to be fast-paced environment but also presents a highly-desirable opportunity for team members to gain exposure to various subject areas and hone their technical skills across various tools and frameworks. Additionally, team members have the ability to interface with an array of different customer groups and present thoughtful solutions to meet the various customer/stakeholder needs. If the desire to succeed in an actively changing and complex problem space excites you, CommandIQ® is the place to be!
                      - text: For this role specifically, candidates who are local to Colorado Springs, CO or King of Prussia, PA are preferred. Strong candidates who exceptionally match the roles and responsibilities will be considered for a fully-remote work schedule. The specific weekly work schedule will be discussed during the hiring process.
                      - paragraph [ref=e1750]: WHY JOIN US
                      - text: Your Health, Your Wealth, Your Life - At Lockheed Martin, we prioritize the well-being of our employees. We offer flexible schedules, competitive pay, and a comprehensive benefits package to support your healthy, fulfilling life both at and outside of work.
                      - paragraph [ref=e1751]: "Basic Qualifications:"
                      - list [ref=e1752]:
                        - listitem [ref=e1753]: Frontend framework development experience using Angular, javascript, CSS, and HTML
                      - list [ref=e1754]:
                        - listitem [ref=e1755]: Experience using REST API's and Docker
                      - list [ref=e1756]:
                        - listitem [ref=e1757]: Experience with UI/UX Design & Iteration Process/Tools (Figma, MockFlow, UXPin, Axure)
                      - list [ref=e1758]:
                        - listitem [ref=e1759]: Experience performing verification-level testing on UI/UX components and applications using recognized UI/UX Test Frameworks (Cypress, Selenium, Playwright, Jest)
                      - list [ref=e1760]:
                        - listitem [ref=e1761]: Experience across the full Software Development Life Cycle (SDLC)
                      - list [ref=e1762]:
                        - listitem [ref=e1763]: 5+ years of relevant work experience (Advanced Degree may be substituted for 2 years of experience)
                      - paragraph [ref=e1764]: "Desired Skills:"
                      - list [ref=e1765]:
                        - listitem [ref=e1766]: Experience in Agile Methodologies & Tools
                      - list [ref=e1767]:
                        - listitem [ref=e1768]: Experience leading software teams through technical planning activities and mentoring junior engineers
                      - list [ref=e1769]:
                        - listitem [ref=e1770]: Experience in a Full-Stack engineering role
                      - list [ref=e1771]:
                        - listitem [ref=e1772]: Experience with container management using Kubernetes/Helm
                      - list [ref=e1773]:
                        - listitem [ref=e1774]: "Experience with any of the following: Gitlab CI/CD, gRPC, Python, Flask"
                      - list [ref=e1775]:
                        - listitem [ref=e1776]: Previous IRAD experience
                      - list [ref=e1777]:
                        - listitem [ref=e1778]: Active Secret Clearance
                      - paragraph [ref=e1779]: "Security Clearance Statement:"
                      - text: This position requires a government security clearance, you must be a US Citizen for consideration.
                      - paragraph [ref=e1780]: "Clearance Level:"
                      - text: Secret
                      - paragraph [ref=e1781]: Other Important Information You Should Know
                      - paragraph [ref=e1782]: "Expression of Interest:"
                      - text: By applying to this job, you are expressing interest in this position and could be considered for other career opportunities where similar skills and requirements have been identified as a match. Should this match be identified you may be contacted for this and future openings.
                      - paragraph [ref=e1783]: "Ability to Work Remotely:"
                      - text: "Part-time Remote Telework: The employee selected for this position will work part of their work schedule remotely and part of their work schedule at a designated Lockheed Martin facility. The specific weekly schedule will be discussed during the hiring process."
                      - paragraph [ref=e1784]: "Work Schedules:"
                      - text: Lockheed Martin supports a variety of alternate work schedules that provide additional flexibility to our employees. Schedules range from standard 40 hours over a five day work week while others may be condensed. These condensed schedules provide employees with additional time away from the office and are in addition to our Paid Time off benefits.
                      - paragraph [ref=e1785]: "Schedule for this Position:"
                      - text: 4x10 hour day, 3 days off per week
                      - text: "Pay Rate: The annual base salary range for this position in California, Massachusetts, and New York (excluding most major metropolitan areas), Colorado, Hawaii, Illinois, Maryland, Minnesota, New Jersey, Vermont, Washington or Washington DC is $113,900 - $200,905. For states not referenced above, the salary range for this position will reflect the candidate’s final work location. Please note that the salary information is a general guideline only. Lockheed Martin considers factors such as (but not limited to) scope and responsibilities of the position, candidate's work experience, education/ training, key skills as well as market and business considerations when extending an offer."
                      - text: "Benefits offered: Medical, Dental, Vision, Life Insurance, Short-Term Disability, Long-Term Disability, 401(k) match, Flexible Spending Accounts, EAP, Education Assistance, Parental Leave, Paid time off, and Holidays."
                      - text: "(Washington state applicants only) Non-represented full-time employees: accrue at least 10 hours per month of Paid Time Off (PTO) to be used for incidental absences and other reasons; receive at least 90 hours for holidays. Represented full time employees accrue 6.67 hours of Vacation per month; accrue up to 52 hours of sick leave annually; receive at least 96 hours for holidays. PTO, Vacation, sick leave, and holiday hours are prorated based on start date during the calendar year."
                      - text: This position is incentive plan eligible.
                      - text: Lockheed Martin is an equal opportunity employer. Qualified candidates will be considered without regard to legally protected characteristics.
                      - text: The application window will close in 90 days; applicants are encouraged to apply within 5 - 30 days of the requisition posting date in order to receive optimal consideration.
                      - text: At Lockheed Martin, we use our passion for purposeful innovation to help keep people safe and solve the world's most complex challenges. Our people are some of the greatest minds in the industry and truly make Lockheed Martin a great place to work.
                      - text: With our employees as our priority, we provide diverse career opportunities designed to propel, develop, and boost agility. Our flexible schedules, competitive pay, and comprehensive benefits enable our employees to live a healthy, fulfilling life at and outside of work. We place an emphasis on empowering our employees by fostering an inclusive environment built upon integrity and corporate responsibility.
                      - text: If this sounds like a culture you connect with, you’re invited to apply for this role. Or, if you are unsure whether your experience aligns with the requirements of this position, we encourage you to search on Lockheed Martin Jobs, and apply for roles that align with your qualifications.
                      - paragraph [ref=e1786]: "Experience Level:"
                      - text: Experienced Professional
                      - paragraph [ref=e1787]: "Business Unit:"
                      - text: RMS
                      - paragraph [ref=e1788]: "Relocation Available:"
                      - text: "No"
                      - paragraph [ref=e1789]: "Career Area:"
                      - text: Software Engineering
                      - paragraph [ref=e1790]: "Type:"
                      - text: Full-Time
                      - paragraph [ref=e1791]: "Shift:"
                      - text: First
                    - generic [ref=e1792]:
                      - paragraph [ref=e1793]: At Lockheed Martin, we apply our passion for purposeful innovation to keep people safe and solve the world's most complex challenges.
                      - paragraph [ref=e1794]: "Pioneering Defense Technology: From aerospace to outer space to cyber space, you can innovate mission solutions alongside the best minds in the business."
                      - paragraph [ref=e1795]: "United By Culture: Excellence, integrity, and collaboration define us. We accelerate change and embrace one another’s perspectives to win for our customers."
                      - paragraph [ref=e1796]: "Real Impact, Real Growth: Grow your career and skills for life. Our wide array of opportunities and technology-driven learning programs enable your development and agility."
                      - paragraph [ref=e1797]: "Your Health, Your Wealth, Your Life: Competitive pay, comprehensive benefits and flexible schedules designed so you thrive — at work and beyond."
                      - paragraph [ref=e1798]: "Empowered to Be Your Best: Use your strengths to make a difference in the lives of one another, our customers, our communities, and our planet."
                      - paragraph [ref=e1799]: "Here, the possibilities are endless because we offer:"
