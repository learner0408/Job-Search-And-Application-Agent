                      - heading "DESCRIPTION" [level=2] [ref=e1352]
                      - generic [ref=e1353]:
                        - text: We are seeking a Frontend Engineer to join our team. You will own end-to-end delivery of web and native applications spanning interactive robot control interfaces, real-time data visualization, and internal developer tooling. Your decisions will directly shape how operators and customers, researchers experience our technology at scale.
                        - text: You will tackle uniquely complex challenges at the intersection of frontend engineering and advanced robotics—from sub-100ms latency control interfaces to highly-available telemetry pipelines.
                        - text: Key job responsibilities
                        - list [ref=e1354]:
                          - listitem [ref=e1355]: Develop real-time data visualization tools for robotics telemetry and analytics.
                          - listitem [ref=e1356]: Create internal tools that accelerate development and operations workflows.
                          - listitem [ref=e1357]: Optimize frontend performance for low-latency, real-time interactions.
                          - listitem [ref=e1358]: Collaborate with robotics and backend teams to design APIs and data models.
                          - listitem [ref=e1359]: Contribute to the evolution of our interfaces
                        - text: About the team
                        - text: "Fauna Robotics, an Amazon company, is building capable, safe, and genuinely delightful robots for everyday life. Our goal is simple: make robots people actually want to live and interact with in everyday human spaces."
                        - text: We believe that future won’t arrive until building for robotics becomes far more accessible. Today, too much effort is spent reinventing the fundamentals. We’re changing that by developing tightly integrated hardware and software systems that make it faster, safer, and more intuitive to create real-world robotic products.
                        - text: "Our work spans the full stack: mechanical design, control systems, dynamic modeling, and intelligent software. The focus is not just functionality, but experience. We’re building robots that feel responsive, expressive, and genuinely useful."
                        - text: At Fauna, you’ll work at the frontier of this space, helping define how robots move, manipulate, and interact with people in natural environments. It’s an opportunity to solve hard problems across hardware and software with a team focused on making robotics accessible and joyful to build.
                        - text: If you care about making robotics real for everyone and building systems that are as delightful as they are capable, we’re interested in hearing from you.
                      - heading "BASIC QUALIFICATIONS" [level=2] [ref=e1360]
                      - list [ref=e1361]:
                        - listitem [ref=e1362]: Bachelor's degree in computer science or equivalent, or experience in software development
                        - listitem [ref=e1363]: 3+ years of professional front end development experience
                        - listitem [ref=e1364]: Experience building web applications with React and modern web technologies
                        - listitem [ref=e1365]: Experience with responsive design, as well as cross-browser development and testing
                        - listitem [ref=e1366]: Experience Experienced with end-to-end ownership of major project deliverables
                        - listitem [ref=e1367]: Proficiency in TypeScript and Javascript
                        - listitem [ref=e1368]: Familiarity with REST APIs and WebSocket-based real-time communication.
                      - heading "PREFERRED QUALIFICATIONS" [level=2] [ref=e1369]
                      - list [ref=e1370]:
                        - listitem [ref=e1371]: "Experience in one or more of the following: Native mobile development (Android/iOS), Python, Objective-C, Swift, C#, HTML5/CSS3/JavaScript, web and server programming and Responsive/Adaptive design, Java, SQL"
                        - listitem [ref=e1372]: Experience with video encoding and streaming media standards
                        - listitem [ref=e1373]: Experience developing scripts and plugins for 3D applications such as Maya or Blender
                        - listitem [ref=e1374]: Experience building control interfaces or dashboards for hardware systems.
                      - text: Amazon is an equal opportunity employer and does not discriminate on the basis of protected veteran status, disability, or other legally protected status.
                      - text: Our inclusive culture empowers Amazonians to deliver the best results for our customers. If you have a disability and need a workplace accommodation or adjustment during the application and hiring process, including support for the interview or onboarding process, please visit https://amazon.jobs/content/en/how-we-hire/accommodations for more information. If the country/region you’re applying in isn’t listed, please contact your Recruiting Partner.
                      - paragraph [ref=e1375]: The base salary range for this position is listed below. Your Amazon package will include sign-on payments and restricted stock units (RSUs). Final compensation will be determined based on factors including experience, qualifications, and location. Amazon also offers comprehensive benefits including health insurance (medical, dental, vision, prescription, Basic Life & AD&D insurance and option for Supplemental life plans, EAP, Mental Health Support, Medical Advice Line, Flexible Spending Accounts, Adoption and Surrogacy Reimbursement coverage), 401(k) matching, paid time off, and parental leave. Learn more about our benefits at https://amazon.jobs/en/benefits.
                      - text: USA, NY, New York - 158,100.00 - 213,800.00 USD annually
