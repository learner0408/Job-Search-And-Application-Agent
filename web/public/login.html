<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Sign in · Job Search Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #2563eb;
      --color-primary-hover: #1d4ed8;
      --color-primary-light: #eff6ff;
      --color-bg: #f1f5f9;
      --color-surface: #ffffff;
      --color-header: #0f172a;
      --color-text: #1e293b;
      --color-text-secondary: #64748b;
      --color-border: #e2e8f0;
      --radius: 12px;
      --radius-sm: 8px;
      --shadow-md: 0 4px 12px rgba(0,0,0,0.10);
      --font: 'Inter', system-ui, -apple-system, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font);
      background: var(--color-bg);
      color: var(--color-text);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      background: var(--color-surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      padding: 36px 32px;
    }
    .auth-card h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }
    .auth-card .sub {
      color: var(--color-text-secondary);
      font-size: 14px;
      margin-bottom: 24px;
    }
    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 11px 16px;
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-weight: 600;
      font-family: var(--font);
      cursor: pointer;
      border: 1.5px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text);
      transition: background 0.2s, border-color 0.2s;
      text-decoration: none;
      margin-bottom: 12px;
    }
    .social-btn:hover {
      background: var(--color-bg);
      border-color: #cbd5e1;
    }
    .social-btn svg { width: 18px; height: 18px; flex-shrink: 0; }
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--color-text-secondary);
      font-size: 13px;
      margin: 20px 0;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--color-border);
    }
    .field { margin-bottom: 14px; }
    .field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--color-text-secondary);
      margin-bottom: 4px;
    }
    .field input {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-family: var(--font);
      outline: none;
      transition: border-color 0.2s;
      background: var(--color-surface);
      color: var(--color-text);
    }
    .field input:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
    }
    .primary-btn {
      width: 100%;
      padding: 11px 16px;
      background: var(--color-primary);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-weight: 600;
      font-family: var(--font);
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 4px;
    }
    .primary-btn:hover { background: var(--color-primary-hover); }
    .primary-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .msg {
      display: none;
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 14px;
    }
    .msg.error { display: block; background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }
    .msg.info { display: block; background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af; }
    .toggle {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
      color: var(--color-text-secondary);
    }
    .toggle a {
      color: var(--color-primary);
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }
    .toggle a:hover { text-decoration: underline; }
    .footer-note {
      margin-top: 20px;
      text-align: center;
      font-size: 12px;
      color: var(--color-text-secondary);
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <h1 id="cardTitle">Welcome back</h1>
    <p class="sub" id="cardSub">Sign in to continue to Job Search Agent</p>

    <div id="socialSection">
      <a class="social-btn" href="/api/auth/google">
        <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.1 6.1 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.1 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.1 5.7l6.2 5.2C36.9 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
        Continue with Google
      </a>
      <a class="social-btn" href="/api/auth/github">
        <svg viewBox="0 0 16 16" fill="#1f2328"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
        Continue with GitHub
      </a>
      <div class="divider">or</div>
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="email" placeholder="you@example.com">
    </div>
    <div class="field" id="passwordField">
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" placeholder="••••••••">
    </div>
    <button class="primary-btn" id="submitBtn">Sign In</button>

    <div class="msg" id="msg"></div>

    <div class="toggle">
      <span id="toggleText">Don't have an account?</span>
      <a id="toggleLink">Create account</a>
    </div>
    <div class="footer-note">Signups are limited. Accounts are created on approval.</div>
  </div>

  <script>
    let isLogin = true;
    const cardTitle = document.getElementById('cardTitle');
    const cardSub = document.getElementById('cardSub');
    const socialSection = document.getElementById('socialSection');
    const passwordField = document.getElementById('passwordField');
    const submitBtn = document.getElementById('submitBtn');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const msg = document.getElementById('msg');
    const toggleText = document.getElementById('toggleText');
    const toggleLink = document.getElementById('toggleLink');

    const waitlist = new URLSearchParams(window.location.search).get('waitlist');

    function showMsg(text, type) {
      msg.className = 'msg ' + type;
      msg.textContent = text;
    }

    function setMode(login) {
      isLogin = login;
      cardTitle.textContent = login ? 'Welcome back' : 'Create your account';
      cardSub.textContent = login ? 'Sign in to continue to Job Search Agent' : 'Start your job search journey';
      passwordField.style.display = login ? 'block' : 'none';
      socialSection.style.display = login ? 'block' : 'none';
      submitBtn.textContent = login ? 'Sign In' : 'Create Account';
      toggleText.textContent = login ? "Don't have an account?" : 'Already have an account?';
      toggleLink.textContent = login ? 'Create account' : 'Sign in';
      msg.className = 'msg';
    }

    toggleLink.addEventListener('click', () => setMode(!isLogin));

    function setBusy(busy) {
      submitBtn.disabled = busy;
      submitBtn.textContent = busy ? (isLogin ? 'Signing in...' : 'Creating...') : (isLogin ? 'Sign In' : 'Create Account');
    }

    submitBtn.addEventListener('click', async () => {
      const email = emailInput.value.trim();
      if (!email || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
        showMsg('Please enter a valid email address.', 'error');
        return;
      }
      const endpoint = isLogin ? '/api/auth/login' : '/api/auth/register';
      const body = isLogin ? { email, password: passwordInput.value } : { email };
      setBusy(true);
      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (!res.ok) {
          showMsg(data.detail || 'Something went wrong.', 'error');
          return;
        }
        if (!isLogin) {
          if (data.status === 'pending') {
            showMsg('You are on the waitlist. We are currently at capacity — you will be admitted automatically when a slot opens.', 'info');
            setMode(true);
            return;
          }
          setMode(true);
        }
        window.location.href = '/';
      } catch (err) {
        showMsg('Network error. Please try again.', 'error');
      } finally {
        setBusy(false);
      }
    });

    passwordInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') submitBtn.click();
    });
    emailInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { if (isLogin) passwordInput.focus(); else submitBtn.click(); }
    });

    if (waitlist) {
      showMsg('Signups are currently at capacity. You have been added to the waitlist and will be admitted automatically when a slot opens.', 'info');
    }
  </script>
</body>
</html>
