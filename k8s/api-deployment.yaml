apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      volumes:
      - name: db-data
        hostPath:
          path: /data/job-db
          type: DirectoryOrCreate
      containers:
      - name: api
        image: job-api:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        env:
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-env
              key: ANTHROPIC_API_KEY
        - name: GROQ_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-env
              key: GROQ_API_KEY
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-env
              key: GEMINI_API_KEY
        - name: DB_PATH
          value: /app/data/history.db
        volumeMounts:
        - name: db-data
          mountPath: /app/data
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
